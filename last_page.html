<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호랑이 형님 - 동화 앞표지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4eee1; /* 따뜻하고 포근한 느낌의 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden; /* 페이지 전환 시 스크롤 방지 */
        }

        /* 전체 책 뷰어 컨테이너 */
        .book-viewer {
            position: relative;
            width: 100%;
            max-width: 1700px;
            padding: 20px 60px; /* 양옆 화살표 공간 확보 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 책 표지 컨테이너 */
        .book-cover-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 책 표지 카드 디자인 */
        .book-cover {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 
                        0 5px 15px rgba(0, 0, 0, 0.1);
            border: 4px solid #d4c3a3;
            transition: transform 0.3s ease;
        }

        .book-cover:hover {
            transform: translateY(-5px);
        }

        /* 앞표지 이미지 스타일 */
        .cover-image-wrapper {
            width: 100%;
            line-height: 0; /* 이미지 하단 여백 제거 */
        }

        .cover-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* 페이지 이동 네비게이션 버튼 스타일 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(212, 195, 163, 0.8);
            color: #5c4033;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-btn:hover {
            background-color: rgba(212, 195, 163, 1);
            transform: translateY(-50%) scale(1.1);
        }

        /* 다음 페이지 버튼 위치 (오른쪽) */
        .next-btn {
            right: 10px;
        }

        /* 이전 페이지 버튼 (현재는 앞표지라 숨김 처리 혹은 필요시 사용) */
        .prev-btn {
            left: 10px;
            display: flex; /* 앞표지에서는 이전이 없으므로 숨김 */
        }
    </style>
</head>
<body>

    <div class="book-viewer">
        <!-- 이전 페이지 버튼 (필요시 활성화 가능) -->
        <button class="nav-btn prev-btn" onclick="prevPage()">&#10094;</button>

        <!-- 앞표지 영역 -->
        <div class="book-cover-container">
            <div class="book-cover">
                <div class="cover-image-wrapper">
                    <img src="./img/last_page.png" alt="호랑이 형님 동화 마지막 표지">
                </div>
            </div>
        </div>

        
    </div>

    <script>
        function prevPage() {
            location.href = "page6.html"; 
            
        }
    </script>

</body>
</html>
