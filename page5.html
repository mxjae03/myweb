<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호랑이 형님 - 동화 본문</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4eee1; /* 따뜻하고 포근한 느낌의 배경색 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
        }

        /* 전체 책 뷰어 컨테이너 */
        .book-viewer {
            position: relative;
            width: 100%;
            max-width: 1700px;
            padding: 20px 60px; /* 양옆 화살표 공간 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 본문 페이지 박스 (펼쳐진 책 한 페이지 느낌) */
        .book-page {
            width: 100%;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15), 
                        0 5px 15px rgba(0, 0, 0, 0.1);
            border: 4px solid #d4c3a3;
            display: flex;
            flex-direction: row; /* 좌우 배치 */
            min-height: 750px;
        }

        /* 왼쪽: 일러스트 영역 */
        .page-image-section {
            flex: 1;
            background-color: #f9f6f0;
            border-right: 2px dashed #e2d4bc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .page-image-section img {
            width: 100%;
            height: auto;
            max-height: 650px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        /* 오른쪽: 텍스트 내용 영역 */
        .page-content-section {
            flex: 1;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 동화 본문 텍스트 스타일 */
        .story-text h3 {
            font-size: 28px;
            color: #5c4033;
            margin-bottom: 25px;
            border-bottom: 2px solid #d4c3a3;
            padding-bottom: 10px;
        }

        .story-text p {
            font-size: 20px;
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
            text p -align: center;
            margin-top: 200px; 
            
            
        }

        /* 페이지 번호 */
        .page-number {
            text-align: right;
            font-size: 16px;
            color: #8c7355;
            font-weight: bold;
        }

        /* 네비게이션 버튼 스타일 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(212, 195, 163, 0.8);
            color: #5c4033;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s, transform 0.2s;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-btn:hover {
            background-color: rgba(212, 195, 163, 1);
            transform: translateY(-50%) scale(1.1);
        }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }

        /* 반응형 디자인 (화면이 작아지면 상하 배치로 전환) */
        @media (max-width: 1024px) {
            .book-page {
                flex-direction: column;
            }
            .page-image-section {
                border-right: none;
                border-bottom: 2px dashed #e2d4bc;
            }
        }
    </style>
</head>
<body>

    <div class="book-viewer">
        <!-- 이전 페이지 버튼 (앞표지로 이동) -->
        <button class="nav-btn prev-btn" onclick="prevPage()">&#10094;</button>

        <!-- 본문 페이지 틀 -->
        <div class="book-page">
            <!-- 왼쪽: 이미지 공간 -->
            <div class="page-image-section">
                <!-- 본문 일러스트 이미지 경로를 넣어주세요 -->
                <img src="./img/img5.png" alt="동화 본문 이미지">
            </div>

            <!-- 오른쪽: 글 내용 공간 -->
            <div class="page-content-section">
                <div class="story-text">
                    <h3>제 5장.아기 호랑이들을 만나다</h3>
                    <p>어느 날, 나무꾼은 산속에서 꼬리에 하얀 천을 단 아기 호랑이 세 마리를 만났어요. 아기 호랑이들이 슬픈 얼굴로 말했답니다.
"우리 할머니가 돌아가셨다는 소식을 듣고, 아버지는 너무 슬퍼서 굴 밖으로 나오지도 않으셨어요. '어머니, 어머니' 하고 울기만 하다가 그만 아프셔서 돌아가셨답니다. 그래서 우리가 슬픈 마음을 담아 하얀 천을 달았어요."</p>
                </div>
                <!-- 페이지 번호 -->
                <div class="page-number">- 5 -</div>
            </div>
        </div>

        <!-- 다음 페이지 버튼 -->
        <button class="nav-btn next-btn" onclick="nextPage()">&#10095;</button>
    </div>

    <script>
        function prevPage() {
            // 앞표지 파일명(예: index.html)으로 이동
            location.href = "page4.html"; 
        }

        function nextPage() {
            location.href = "page6.html";
        }
    </script>

</body>
</html>
