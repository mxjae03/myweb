<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITBOX - INTRO</title>
    <style>
        /* 인트로 페이지 정중앙 배치 스타일 */
.intro-body {
    background-color: #111111;
    color: #ffffff;
    height: 100vh; /* 화면 전체 높이 사용 */
    display: flex;
    justify-content: center; /* 가로 중앙 정렬 */
    align-items: center;     /* 세로 중앙 정렬 */
    text-align: center;      /* 내부 텍스트 가운데 정렬 */
}

.intro-content h1 {
    font-size: 48px;
    font-weight: 800;
    margin-bottom: 20px;
    letter-spacing: 2px;
}

.btn-enter {
    display: inline-block;
    padding: 12px 35px;
    background-color: #ffffff;
    color: #111111;
    font-weight: bold;
    border-radius: 4px;
    text-decoration: none;
    
}

.btn-enter:hover {
    background-color: #dddddd;
}
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body class="intro-body">
    <div class="intro-content">
        <h1>FITBOX</h1>
        <a href="test.html" class="btn-enter">SHOP 입장하기</a>
    </div>
</body>
</html>
