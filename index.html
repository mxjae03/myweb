<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Cyberpunk Project Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Pretendard', 'sans-serif'],
                        cyber: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyberDark: '#080612',
                        cyberCard: 'rgba(20, 15, 35, 0.75)',
                        neonCyan: '#00f0ff',
                        neonPink: '#ff007f',
                        neonPurple: '#9d00ff'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #080612;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Animated glowing background mesh */
        .bg-mesh {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 0, 127, 0.1) 0%, transparent 50%);
            filter: blur(60px);
        }

        /* Glassmorphism & Neon border hover effects */
        .neon-card {
            background: rgba(25, 20, 45, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .neon-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25), inset 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .neon-card:hover .card-icon {
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            transform: scale(1.1);
        }

        /* Scanline effect overlay */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.2) 50%,
                rgba(0, 0, 0, 0.2)
            );
            background-size: 100% 4px;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 50;
            opacity: 0.25;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center relative p-6">

    <div class="bg-mesh"></div>
    <div class="scanlines"></div>

    <header class="text-center mb-12 relative z-10">
        
        <h1 class="text-3xl md:text-5xl font-extrabold font-cyber tracking-wider bg-gradient-to-r from-white via-cyan-200 to-pink-400 bg-clip-text text-transparent drop-shadow-md">
            PROJECT 
        </h1>
        <p class="text-gray-400 text-sm md:text-base mt-2 font-medium tracking-wide">
            접속할 프로젝트 세션을 선택하세요.
        </p>
    </header>

    <main class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 gap-6 relative z-10 px-4">
        
        <!-- Project Card 1: Letter (기존 Bank 위치) -> prj.html 연결 -->
        <a href="prj.html" class="neon-card rounded-2xl p-8 flex flex-col items-center justify-center text-center group cursor-pointer relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 to-blue-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="card-icon text-4xl mb-4 text-cyan-400 transition-all duration-300">
                ✉️
            </div>
            <h2 class="text-xl md:text-2xl font-bold font-cyber text-white tracking-wide group-hover:text-cyan-300 transition-colors">
                Letter
            </h2>
            <p class="text-gray-400 text-sm mt-2 font-normal group-hover:text-gray-200 transition-colors">
                마음을 전하는 편지함 어플리케이션
            </p>
            <div class="mt-6 flex items-center text-xs font-cyber text-cyan-400 opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                ACCESS SYSTEM &rarr;
            </div>
        </a>

        <!-- Project Card 2: Story Book (기존 Dessert Shop 위치) -> page1.html 연결 -->
        <a href="in.html" class="neon-card rounded-2xl p-8 flex flex-col items-center justify-center text-center group cursor-pointer relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-pink-500 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="card-icon text-4xl mb-4 text-pink-400 transition-all duration-300">
                📖
            </div>
            <h2 class="text-xl md:text-2xl font-bold font-cyber text-white tracking-wide group-hover:text-pink-300 transition-colors">
                Story Book
            </h2>
            <p class="text-gray-400 text-sm mt-2 font-normal group-hover:text-gray-200 transition-colors">
                움직이는 인터랙티브 동화책
            </p>
            <div class="mt-6 flex items-center text-xs font-cyber text-pink-400 opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                ACCESS SYSTEM &rarr;
            </div>
        </a>

        <!-- Project Card 3: Empty Slot (비워둔 박스) -->
        <a href="./ds01.html" class="neon-card rounded-2xl p-8 flex flex-col items-center justify-center text-center group cursor-pointer relative overflow-hidden opacity-60 hover:opacity-150">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 to-indigo-600 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="card-icon text-4xl mb-4 text-purple-400 transition-all duration-300">
                🏦
            </div>
            <h2 class="text-xl md:text-2xl font-bold font-cyber text-white tracking-wide group-hover:text-purple-300 transition-colors">
                Bank
            </h2>
            <p class="text-gray-400 text-sm mt-2 font-normal group-hover:text-gray-200 transition-colors">
                은행
            </p>
            <div class="mt-6 flex items-center text-xs font-cyber text-purple-400 opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                ACCESS SYSTEM &rarr;
            </div>
        </a>

        <!-- Project Card 4: Empty Slot (비워둔 박스) -->
        <a href="#" class="neon-card rounded-2xl p-8 flex flex-col items-center justify-center text-center group cursor-pointer relative overflow-hidden opacity-60 hover:opacity-100">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <div class="card-icon text-4xl mb-4 text-emerald-400 transition-all duration-300">
                📚
            </div>
            <h2 class="text-xl md:text-2xl font-bold font-cyber text-white tracking-wide group-hover:text-emerald-300 transition-colors">
                Study
            </h2>
            <p class="text-gray-400 text-sm mt-2 font-normal group-hover:text-gray-200 transition-colors">
                공간
            </p>
            <div class="mt-6 flex items-center text-xs font-cyber text-emerald-400 opacity-0 group-hover:opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                ACCESS SYSTEM &rarr;
            </div>
        </a>

    </main>

    <footer class="mt-16 text-center text-xs text-gray-500 font-cyber tracking-widest relative z-10">
        
    </footer>

</body>
</html>
