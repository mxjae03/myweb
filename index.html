<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 부산은행</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .header-container {
            width: 100%;
            padding: 52px 0;
            background-color: #ffffff;
            border-bottom: 2px solid #C8102E; /* 하단 빨간 선 */
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0px 20px;
            display: flex;
            align-items: center;
            
            
        }

        
        .logo {
            font-weight: bold;
            font-size: 18px;
            color: #5d5a5a;
        }
        
        .logo span {
            color: #d61a39;
            margin-right: -2px;
            font-size: 22px;
            margin-left: 97px;
        }
        .logo1 {
            
            font-weight: bold;
            font-size: 15px;
            color: black;
            /* 개인뱅킹을 왼쪽 로고와 멀리 떨어뜨리고 싶을 때 사용 */
            margin-left: 350px; 
        }

        .logo2, .logo3 {
            font-weight: bold;
            font-size: 15px;
            color: black;
            margin-left: 40px; /* 메뉴들 사이의 간격 */
        }
        
       
    </style>
</head>
<body>
    

    <header class="header-container">
        <div class="header-inner">
                <div class="logo">
                    <span>BNK</span> 부산은행
            </div>
            
            <div class="logo1">개인뱅킹</div>
            <div class="logo2">기업뱅킹</div>
            <div class="logo3">금융상품</div>
           
                
        </div>
    </header>

</body>
</html>
