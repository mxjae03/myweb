<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITBOX - 헬스·운동용품 쇼핑몰</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <header class="header">
        <div class="header-inner">
            <!-- 로고 -->
            <div class="logo">
                <a href="#">FITBOX</a>
            </div>
            <!-- 메뉴 -->
            <nav class="nav">
                <ul>
                    <li><a href="#">HOME</a></li>
                    <li><a href="#">PRODUCT</a></li>
                    <li><a href="#">BEST</a></li>
                    <li><a href="#">EVENT</a></li>
                </ul>
            </nav>
            <!-- 우측 유저 메뉴 -->
            <div class="user-menu">
                <a href="#">로그인</a>
                <a href="#">장바구니</a>
            </div>
        </div>
    </header>

    <!-- 메인 배너 영역 -->
    <section class="main-banner">
        <div class="banner-content">
            <h2>FIT YOUR LIFE</h2>
            <a href="#" class="btn-primary">상품 보러가기</a>
        </div>
    </section>

    <!-- 상품 카테고리 영역 -->
    <section class="category-section">
        <div class="container">
            <h3 class="section-title">PRODUCT CATEGORY</h3>
            <div class="category-list">
                <div class="category-item">덤벨</div>
                <div class="category-item">운동매트</div>
                <div class="category-item">헬스용품</div>
                <div class="category-item">보충제</div>
            </div>
        </div>
    </section>
     <!-- 베스트 상품 영역  -->
      <section class="best-section">
        <div class="container">
            <h3 class="section-title">BEST PRODUCT</h3>
            <div class="product-grid">
                
                <!-- 상품 1 -->
                 <div class="product-card">
                    <div class="product-img1"><img src="./images/dumbbell.jpg" alt="덤벨 이미지";></div>
                    <div class="product-info">
                        <h4 class="product-name">FITBOX 덤벨</h4>
                        
                        <p class="product-price">39,900원</p>
                    </div>
                </div>

                 <!-- 상품 2 -->
                 <div class="product-card">
                    <div class="product-img1"><img src="./images/exercise mat.jpg" alt="덤벨 이미지";></div>
                    <div class="product-info">
                        <h4 class="product-name">FITBOX 운동메트</h4>
                        <p class="product-price">17,900원</p>
                    </div>
                </div>

                 <!-- 상품 3 -->
                 <div class="product-card">
                    <div class="product-img"><img src="./images/scrap.jpg" alt="덤벨 이미지";></div>
                    <div class="product-info">
                        <h4 class="product-name">FITBOX 쉴드 시그니처 락킹 헬스 8자 스트랩</h4>
                        
                        <p class="product-price">10,900원</p>
                    </div>
                </div>

                <!-- 상품 4 -->
                 <div class="product-card">
                    <div class="product-img"><img src="./images/protein.jpg" alt="덤벨 이미지";></div>
                    <div class="product-info">
                        <h4 class="product-name">FITBOX 프로틴</h4>
                        
                        <p class="product-price">10,900원</p>
                    </div>
                </div>

                
                
                
    
</div>

    
</body>
</html>
